name: Ensure Issue Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            const labels = [
              { name: 'triage', color: '1d76db', description: 'Needs triage' },
              { name: 'refactor', color: '5319e7', description: 'Code refactoring and quality improvements' },
              { name: 'tests', color: '0e8a16', description: 'Test coverage, failures, and testing issues' },
              { name: 'bug', color: 'd73a4a', description: 'Something isn\'t working' },
              { name: 'enhancement', color: 'a2eeef', description: 'New feature or request' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`Created label: ${label.name}`);
              } catch (error) {
                if (error.status === 422) {
                  console.log(`Label already exists: ${label.name}`);
                } else {
                  console.error(`Failed to create label ${label.name}:`, error);
                }
              }
            }
