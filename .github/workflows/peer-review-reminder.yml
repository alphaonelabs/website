name: Peer Review Reminder

# Labels PRs "peer reviewed" once someone other than the author approves them,
# reminds authors (on GitHub and in Slack) when they still need a peer review.
# Logic lives in .github/scripts/peer_review.js.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [Peer Review Event]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: peer-review-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || 'all' }}
  cancel-in-progress: false

jobs:
  check-peer-review:
    runs-on: ubuntu-latest
    name: Check PR has a peer review
    steps:
      # Base-branch checkout only (never the PR's code), for the shared script.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          SLACK_PEER_REVIEW_WEBHOOK: ${{ secrets.SLACK_PEER_REVIEW_WEBHOOK }}
          SLACK_PEER_REVIEW_CHANNEL: ${{ vars.SLACK_PEER_REVIEW_CHANNEL }}
        with:
          script: |
            const run = require('./.github/scripts/peer_review.js');
            await run({ github, context, core });
