<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotLab — Alpha One Labs</title>
  <meta name="description" content="BotLab: a free, open-source virtual robotics playground from Alpha One Labs.">
  <link rel="stylesheet" href="https://design.alphaonelabs.com/brand.css">
  <script src="https://design.alphaonelabs.com/chrome.js" defer></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            sys: {
              // Semantic brand tokens: follow the light/dark toggle in <a1-header>
              dark: 'var(--a1-bg)',
              grid: 'var(--a1-surface)',
              raised: 'var(--a1-surface-raised)',
              line: 'var(--a1-border)',
              accent: 'var(--bl-accent-text)',
              muted: 'var(--a1-text-muted)',
              text: 'var(--a1-text)',
              onaccent: 'var(--a1-on-accent)',
            }
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--a1-bg);
      color: var(--a1-text);
      /* clip (not hidden) keeps the window as the scroller, so the sticky
         header and GSAP ScrollTrigger reveals both work */
      overflow-x: clip;
      scroll-behavior: smooth;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }
    .content-layer {
      position: relative;
      z-index: 10;
    }
    ::-webkit-scrollbar {
      width: 0px;
    }
    .system-font {
      font-family: var(--a1-font-mono);
      letter-spacing: -0.02em;
    }
    .system-font h1, .system-font h2, .system-font h3 {
      font-family: var(--a1-font-display);
    }
    .system-font p { font-family: var(--a1-font-body); }
    a1-header { display: block; min-height: 67px; }
    /* Gold for small text: brand accent, darkened in light theme for AA contrast */
    :root { --bl-accent-text: var(--a1-accent); }
    @media (prefers-color-scheme: light) { :root:not([data-a1-theme="dark"]) { --bl-accent-text: #6f5d24; } }
    [data-a1-theme="light"] { --bl-accent-text: #6f5d24; }
    [data-a1-theme="dark"] { --bl-accent-text: var(--a1-accent); }
    a1-footer { display: block; position: relative; z-index: 20; }
    .a1-slot-btn {
      padding: 8px 14px; border-radius: 999px; white-space: nowrap; text-decoration: none;
      font: 600 14px/1 var(--a1-font-body); color: var(--a1-on-accent); background: var(--a1-accent);
    }
    .a1-slot-btn:hover { background: var(--a1-accent-hover); }
    @media (max-width: 480px) { .a1-slot-btn { display: none; } }
    /* Maker illustrations from the design system, tinted with the theme accent */
    .a1-illo {
      background: var(--a1-accent);
      -webkit-mask: var(--illo) center / contain no-repeat;
      mask: var(--illo) center / contain no-repeat;
      pointer-events: none;
    }
    .a1-illo--soldering { --illo: url("https://design.alphaonelabs.com/assets/illustrations/soldering-iron.svg"); }
    .a1-illo--circuit { --illo: url("https://design.alphaonelabs.com/assets/illustrations/circuit.svg"); }
    .a1-illo--transistor { --illo: url("https://design.alphaonelabs.com/assets/illustrations/transistor.svg"); }
    :focus-visible {
      outline: 2px solid var(--a1-focus, #e2c66a);
      outline-offset: 3px;
    }
    .stagger-text span {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
    }
    .interactive-canvas {
      pointer-events: auto !important;
      cursor: crosshair;
    }

    /* High-Tech Button */
    .tech-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 40px;
      background: var(--a1-surface);
      border: 1px solid rgba(199, 171, 79, 0.45);
      color: var(--bl-accent-text);
      font-family: var(--a1-font-mono);
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 20;
    }

    .tech-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(199, 171, 79, 0.05) 40%,
        rgba(199, 171, 79, 0.05) 60%,
        transparent 100%
      );
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .tech-btn:hover::before {
      transform: translateX(100%);
    }

    .tech-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(199, 171, 79, 0.03) 2px,
        rgba(199, 171, 79, 0.03) 4px
      );
      pointer-events: none;
    }

    .tech-btn:hover {
      border-color: rgba(199, 171, 79, 0.8);
      box-shadow:
        0 0 20px rgba(199, 171, 79, 0.15),
        0 0 60px rgba(199, 171, 79, 0.05),
        inset 0 0 20px rgba(199, 171, 79, 0.05);
      color: var(--a1-text);
      background: rgba(199, 171, 79, 0.12);
      transform: translateY(-2px);
    }

    .tech-btn .btn-icon {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }

    .tech-btn:hover .btn-icon {
      transform: translateX(4px);
    }

    .tech-btn .btn-corner {
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: rgba(199, 171, 79, 0.6);
      transition: all 0.3s ease;
    }

    .tech-btn .btn-corner.tl {
      top: -1px;
      left: -1px;
      border-top: 2px solid;
      border-left: 2px solid;
    }

    .tech-btn .btn-corner.tr {
      top: -1px;
      right: -1px;
      border-top: 2px solid;
      border-right: 2px solid;
    }

    .tech-btn .btn-corner.bl {
      bottom: -1px;
      left: -1px;
      border-bottom: 2px solid;
      border-left: 2px solid;
    }

    .tech-btn .btn-corner.br {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid;
      border-right: 2px solid;
    }

    .tech-btn:hover .btn-corner {
      border-color: var(--a1-accent);
      width: 12px;
      height: 12px;
    }

    .tech-btn .btn-pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120%;
      height: 120%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(199, 171, 79, 0.1);
      border-radius: 2px;
      animation: techPulse 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes techPulse {
      0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.98); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
    }

    .tech-btn .btn-status {
      width: 6px;
      height: 6px;
      background: var(--a1-accent);
      border-radius: 50%;
      animation: statusBlink 1.5s ease-in-out infinite;
      box-shadow: 0 0 6px rgba(199, 171, 79, 0.8);
    }

    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Page Transition Overlay */
    .page-transition {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    .page-transition.active {
      pointer-events: all;
      opacity: 1;
      visibility: visible;
    }

    .page-transition .overlay-bg {
      position: absolute;
      inset: 0;
      background: var(--a1-bg);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .page-transition.active .overlay-bg {
      transform: scaleY(1);
    }

    .page-transition .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(199, 171, 79, 0.03) 2px,
        rgba(199, 171, 79, 0.03) 4px
      );
      opacity: 0;
      transition: opacity 0.3s ease 0.3s;
    }

    .page-transition.active .scanlines {
      opacity: 1;
    }

    .page-transition .wipe-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c7ab4f, transparent);
      box-shadow: 0 0 30px 10px rgba(199, 171, 79, 0.3);
      top: 100%;
      transition: top 0.6s cubic-bezier(0.77, 0, 0.175, 1) 0.2s;
    }

    .page-transition.active .wipe-line {
      top: -2px;
    }

    .page-transition .loader-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--a1-font-mono);
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--bl-accent-text);
      opacity: 0;
      transition: opacity 0.3s ease 0.5s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-transition.active .loader-text {
      opacity: 1;
    }

    .page-transition .loader-text .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(199, 171, 79, 0.2);
      border-top-color: var(--a1-accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .page-transition .corner-mark {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: rgba(199, 171, 79, 0.4);
      opacity: 0;
      transition: opacity 0.3s ease 0.5s;
    }

    .page-transition.active .corner-mark { opacity: 1; }

    .page-transition .corner-mark.tl { top: 20px; left: 20px; border-top: 2px solid; border-left: 2px solid; }
    .page-transition .corner-mark.tr { top: 20px; right: 20px; border-top: 2px solid; border-right: 2px solid; }
    .page-transition .corner-mark.bl { bottom: 20px; left: 20px; border-bottom: 2px solid; border-left: 2px solid; }
    .page-transition .corner-mark.br { bottom: 20px; right: 20px; border-bottom: 2px solid; border-right: 2px solid; }
  </style>
</head>
<body>
  <!-- Page Transition Overlay -->
  <div class="page-transition" id="page-transition">
    <div class="overlay-bg"></div>
    <div class="scanlines"></div>
    <div class="wipe-line"></div>
    <div class="loader-text">
      <div class="spinner"></div>
      <span>Loading System</span>
    </div>
    <div class="corner-mark tl"></div>
    <div class="corner-mark tr"></div>
    <div class="corner-mark bl"></div>
    <div class="corner-mark br"></div>
  </div>

  <a1-header site="BotLab" site-href="/" sticky>
    <a slot="actions" href="https://github.com/alphaonelabs/website/tree/main/botlab" target="_blank" rel="noopener noreferrer" class="a1-slot-btn">Contribute</a>
  </a1-header>

  <main id="root"></main>

  <a1-footer source="botlab"></a1-footer>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;
    gsap.registerPlugin(ScrollTrigger);

    const CanvasSystem = () => {
      const canvasRef = useRef(null);
      const mouse = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let rAF;
        // Grid lines follow the brand theme (dark/light) via the --a1-border token.
        let gridColor = '#2e2e2e';
        const readTheme = () => {
          gridColor = getComputedStyle(document.documentElement).getPropertyValue('--a1-border').trim() || gridColor;
        };
        readTheme();
        document.addEventListener('a1-themechange', () => requestAnimationFrame(readTheme));
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', readTheme);

        const resize = () => {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * window.devicePixelRatio;
          canvas.height = height * window.devicePixelRatio;
          ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
          initParticles();
        };

        const initParticles = () => {
          particles = [];
          const count = 150;
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 0.5,
              vy: (Math.random() - 0.5) * 0.5,
              baseSize: Math.random() * 2 + 1,
              connections: []
            });
          }
        };

        const drawGrid = () => {
          ctx.strokeStyle = gridColor;
          ctx.lineWidth = 1;
          const gridSize = 50;
          for (let x = 0; x < width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
          }
          for (let y = 0; y < height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }
        };

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          drawGrid();

          const maxDist = 150;

          particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;

            const dx = mouse.current.x - p.x;
            const dy = mouse.current.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 200) {
              const force = (200 - dist) / 200;
              p.x -= (dx * force * 0.05);
              p.y -= (dy * force * 0.05);
            }

            ctx.fillStyle = '#666666';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.baseSize, 0, Math.PI * 2);
            ctx.fill();
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist2 = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist2 < maxDist) {
                ctx.strokeStyle = `rgba(150, 150, 150, ${0.15 * (1 - dist2 / maxDist)})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          });

          rAF = requestAnimationFrame(render);
        };

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
          mouse.current = { x: e.clientX, y: e.clientY };
        });

        resize();
        render();

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(rAF);
        };
      }, []);

      return <canvas ref={canvasRef} className="interactive-canvas opacity-60" />;
    };

    const StaggerText = ({ text, className }) => {
      const ref = useRef(null);
      
      useEffect(() => {
        const textElements = ref.current.querySelectorAll('span');
        gsap.to(textElements, {
          y: 0,
          opacity: 1,
          duration: 0.8,
          stagger: 0.03,
          ease: "power3.out",
          scrollTrigger: {
            trigger: ref.current,
            start: "top 80%",
          }
        });
      }, []);

      return (
        <div ref={ref} className={`stagger-text ${className}`}>
          {text.split('').map((char, i) => (
            <span key={i} style={{ display: char === ' ' ? 'inline' : 'inline-block' }}>
              {char === ' ' ? '\u00A0' : char}
            </span>
          ))}
        </div>
      );
    };

    const App = () => {
      const containerRef = useRef(null);
      
      useEffect(() => {

        const sections = gsap.utils.toArray('.js-section');
        
        sections.forEach((sec, i) => {
          gsap.fromTo(sec, 
            { opacity: 0, y: 50 }, 
            {
              opacity: 1, 
              y: 0,
              duration: 1,
              ease: "power2.out",
              scrollTrigger: {
                trigger: sec,
                start: "top 75%",
                end: "bottom 25%",
                toggleActions: "play reverse play reverse"
              }
            }
          );
        });

        // Trigger positions go stale when web fonts and the brand header
        // load after first render; recompute whenever the page height changes.
        let t;
        const refresh = () => { clearTimeout(t); t = setTimeout(() => ScrollTrigger.refresh(), 150); };
        const ro = new ResizeObserver(refresh);
        ro.observe(document.body);
        document.fonts && document.fonts.ready.then(refresh);
        return () => { ro.disconnect(); clearTimeout(t); };
      }, []);

      const dataSources = [
        "Chassis & Core Processing Unit",
        "Omni-directional Wheels (WASD)",
        "Lidar Scanning Systems",
        "First-Person Camera Feeds",
        "Articulated Robotic Arms",
      ];

      return (
        <div ref={containerRef} className="content-layer system-font w-full">
          <CanvasSystem />


          
          {/* SECTION 1: PRESENCE */}
          <section className="relative min-h-screen flex flex-col justify-center px-6 sm:px-12 md:px-24 pt-12 pb-28">
            <div className="text-xs text-sys-accent font-bold uppercase tracking-[0.18em] mb-4">BOTLAB // ALPHA ONE LABS</div>
            <h1 className="text-4xl sm:text-5xl md:text-8xl font-bold tracking-tighter leading-none mb-6 text-sys-text">
              <StaggerText text="VIRTUAL ROBOTICS" />
            </h1>
            <p className="text-lg md:text-2xl text-sys-muted max-w-2xl leading-relaxed">
              Next-Generation Robotics Simulation Playground. 
              <br/>Build, configure, and test autonomous mobile robots with real-time physics and sensor telemetry directly in your browser.
            </p>

            <div className="flex flex-wrap gap-4 mt-10">
              <a href="home.html" className="tech-btn" onClick={(e) => {
                e.preventDefault();
                const overlay = document.getElementById('page-transition');
                overlay.classList.add('active');
                setTimeout(() => { window.location.href = 'home.html'; }, 1200);
              }}>
                <span className="btn-corner tl"></span>
                <span className="btn-corner tr"></span>
                <span className="btn-corner bl"></span>
                <span className="btn-corner br"></span>
                <span className="btn-pulse"></span>
                <span className="btn-status"></span>
                <span>Enter System</span>
                <svg aria-hidden="true" className="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
              </a>
              <a href="/3D/index.html" className="tech-btn" style={{ letterSpacing: '0.14em' }} onClick={(e) => {
                e.preventDefault();
                const overlay = document.getElementById('page-transition');
                overlay.classList.add('active');
                setTimeout(() => { window.location.href = '/3D/index.html'; }, 1200);
              }}>
                <span className="btn-corner tl"></span>
                <span className="btn-corner tr"></span>
                <span className="btn-corner bl"></span>
                <span className="btn-corner br"></span>
                <span className="btn-pulse"></span>
                <span className="btn-status"></span>
                <span>Assemble a robot in 3D</span>
                <svg aria-hidden="true" className="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M20 7.5L12 3 4 7.5m16 0v9L12 21m8-13.5L12 12m0 9-8-4.5v-9M12 21v-9m0 0L4 7.5m8 4.5 8-4.5" />
                </svg>
              </a>
              <a href="https://github.com/alphaonelabs/website/tree/main/botlab" target="_blank" rel="noopener noreferrer" className="tech-btn">
                <span className="btn-corner tl"></span>
                <span className="btn-corner tr"></span>
                <span className="btn-corner bl"></span>
                <span className="btn-corner br"></span>
                <span>Contribute</span>
                <svg aria-hidden="true" className="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
              </a>
            </div>
            <div aria-hidden="true" className="a1-illo a1-illo--soldering hidden lg:block absolute right-8 xl:right-16 2xl:right-32 top-1/2 -translate-y-1/2 w-[200px] h-[200px] xl:w-[300px] xl:h-[300px] opacity-70"></div>
            <div className="absolute bottom-12 left-6 sm:left-12 md:left-24 text-xs text-sys-muted flex items-center gap-4">
              <span className="animate-pulse h-2 w-2 bg-sys-accent rounded-full" aria-hidden="true"></span>
              SCROLL TO INITIATE SEQUENCE
            </div>
          </section>

          <hr className="a1-trace mx-6 sm:mx-12 md:mx-24" />

          {/* SECTION 2: CONCEPT */}
          <section className="min-h-screen flex flex-col justify-center px-6 sm:px-12 md:px-24 js-section py-24">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
              <div>
                <h2 className="text-3xl md:text-5xl font-medium tracking-tight mb-8">MODULAR ENGINEERING BAY</h2>
                <div className="space-y-6">
                  <p className="text-sys-muted text-lg border-l border-sys-muted pl-4">
                    Assemble your chassis, equip sensors, and deploy your robot in a persistent sandbox environment.
                  </p>
                  <p className="text-sys-accent text-sm font-mono bg-sys-grid inline-block px-3 py-1 border border-sys-line">
                    STATUS: Simulation Engine Online. Physics Core stable.
                  </p>
                </div>
                
                <div className="mt-12 space-y-2 text-sm text-sys-muted">
                  <div className="uppercase tracking-widest mb-4 text-xs border-b border-sys-line pb-2">Available Components</div>
                  {dataSources.map((item, idx) => (
