<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotLab — Alpha One Labs</title>
  <meta name="description" content="BotLab: a free, open-source virtual robotics playground from Alpha One Labs.">
  <link rel="stylesheet" href="https://design.alphaonelabs.com/brand.css">
  <script src="https://design.alphaonelabs.com/chrome.js" defer></script>
  
  <link rel="stylesheet" href="tailwind.css">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--a1-bg);
      color: var(--a1-text);
      /* clip (not hidden) keeps the window as the scroller, so the sticky
         header and GSAP ScrollTrigger reveals both work */
      overflow-x: clip;
      scroll-behavior: smooth;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }
    .content-layer {
      position: relative;
      z-index: 10;
    }
    ::-webkit-scrollbar {
      width: 0px;
    }
    .system-font {
      font-family: var(--a1-font-mono);
      letter-spacing: -0.02em;
    }
    /* v2 type: condensed 900 uppercase titles, Inter for running text */
    .system-font h1, .system-font h2, .system-font h3 {
      font-family: var(--a1-font-display);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.92;
    }
    .system-font h3 { letter-spacing: 0.02em; }
    .system-font p { font-family: var(--a1-font-body); }
    a1-header { display: block; min-height: var(--a1-header-height, 76px); }
    a1-footer { display: block; position: relative; z-index: 20; }
    /* Secondary action slotted into the brand header: hard border, 2px radius */
    .a1-slot-btn {
      display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px;
      border: 1px solid var(--a1-border-strong); border-radius: var(--a1-radius);
      white-space: nowrap; text-decoration: none;
      font: 800 var(--a1-text-xs)/1 var(--a1-font-body); letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--a1-text); background: var(--a1-bg);
    }
    .a1-slot-btn:hover { background: var(--a1-surface-raised); }
    @media (max-width: 720px) { .a1-slot-btn { display: none; } }
    /* PCB circuit art from the design system, tinted with the brass fill */
    .a1-illo {
      background: var(--a1-accent-fill);
      -webkit-mask: var(--illo) center / contain no-repeat;
      mask: var(--illo) center / contain no-repeat;
      pointer-events: none;
    }
    .a1-illo--chip { --illo: url("https://design.alphaonelabs.com/assets/circuits/pcb-chip.svg?v=2"); }
    .a1-illo--frame { --illo: url("https://design.alphaonelabs.com/assets/circuits/pcb-frame.svg?v=2"); }
    .a1-illo--corner { --illo: url("https://design.alphaonelabs.com/assets/circuits/pcb-corner.svg?v=2"); }
    :focus-visible {
      outline: 3px solid var(--a1-focus);
      outline-offset: 3px;
    }
    .stagger-text span {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
    }
    .interactive-canvas {
      pointer-events: auto !important;
      cursor: crosshair;
    }

    /* Buttons: v2 secondary (hard border) and primary (brass fill) */
    .tech-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 22px;
      background: var(--a1-bg);
      border: 1px solid var(--a1-border-strong);
      border-radius: var(--a1-radius);
      color: var(--a1-text);
      font: 800 var(--a1-text-sm)/1 var(--a1-font-body);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s var(--a1-ease), border-color 0.15s var(--a1-ease);
      z-index: 20;
    }
    .tech-btn:hover { background: var(--a1-surface-raised); }
    .tech-btn--primary {
      background: var(--a1-accent-fill);
      border-color: var(--a1-accent-fill);
      color: var(--a1-on-accent);
    }
    .tech-btn--primary:hover { background: var(--a1-gold-hover); border-color: var(--a1-gold-hover); }
    .tech-btn .btn-icon { width: 18px; height: 18px; transition: transform 0.2s var(--a1-ease); }
    .tech-btn:hover .btn-icon { transform: translateX(3px); }
    .tech-btn .btn-corner, .tech-btn .btn-pulse { display: none; }
    .tech-btn .btn-status {
      width: 7px;
      height: 7px;
      background: currentColor;
      border-radius: 50%;
      animation: statusBlink 1.5s ease-in-out infinite;
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Page transition overlay: flat wipe with a single brass rule */
    .page-transition {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }
    .page-transition.active { pointer-events: all; opacity: 1; visibility: visible; }
    .page-transition .overlay-bg {
      position: absolute;
      inset: 0;
      background: var(--a1-bg);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .page-transition.active .overlay-bg { transform: scaleY(1); }
    .page-transition .scanlines { display: none; }
    .page-transition .wipe-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--a1-accent-fill);
      top: 100%;
      transition: top 0.6s cubic-bezier(0.77, 0, 0.175, 1) 0.2s;
    }
    .page-transition.active .wipe-line { top: -2px; }
    .page-transition .loader-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--a1-font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--a1-text);
      opacity: 0;
      transition: opacity 0.3s ease 0.5s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-transition.active .loader-text { opacity: 1; }
    .page-transition .loader-text .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--a1-border);
      border-top-color: var(--a1-accent-fill);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-transition .corner-mark {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--a1-accent-fill);
      opacity: 0;
      transition: opacity 0.3s ease 0.5s;
    }
    .page-transition.active .corner-mark { opacity: 1; }
    .page-transition .corner-mark.tl { top: 20px; left: 20px; border-top: 2px solid; border-left: 2px solid; }
    .page-transition .corner-mark.tr { top: 20px; right: 20px; border-top: 2px solid; border-right: 2px solid; }
    .page-transition .corner-mark.bl { bottom: 20px; left: 20px; border-bottom: 2px solid; border-left: 2px solid; }
    .page-transition .corner-mark.br { bottom: 20px; right: 20px; border-bottom: 2px solid; border-right: 2px solid; }
    @media (prefers-reduced-motion: reduce) {
      .tech-btn .btn-status { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Page Transition Overlay -->
  <div class="page-transition" id="page-transition">
    <div class="overlay-bg"></div>
    <div class="scanlines"></div>
    <div class="wipe-line"></div>
    <div class="loader-text">
      <div class="spinner"></div>
      <span>Loading System</span>
    </div>
    <div class="corner-mark tl"></div>
    <div class="corner-mark tr"></div>
    <div class="corner-mark bl"></div>
    <div class="corner-mark br"></div>
  </div>

  <a1-header site="BotLab" site-href="/" sticky>
    <a slot="actions" href="https://github.com/alphaonelabs/website/tree/main/botlab" target="_blank" rel="noopener noreferrer" class="a1-slot-btn">Contribute</a>
  </a1-header>

  <main id="root"></main>

  <a1-footer source="botlab"></a1-footer>

  <!-- Rebuild landing.js from landing.jsx:
       npx esbuild landing.jsx --outfile=landing.js --jsx=transform --jsx-factory=React.createElement --jsx-fragment=React.Fragment --minify
       Rebuild tailwind.css from tailwind.input.css:
       npx tailwindcss@3.4.17 -c tailwind.config.js -i tailwind.input.css -o tailwind.css --minify -->
  <script src="landing.js"></script>
</body>
</html>
