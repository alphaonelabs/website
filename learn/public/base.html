<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}Alpha One Labs - Activity Platform{% endblock %}" />
  <title>{% block title %}Alpha One Labs{% endblock %}</title>
  <style>
    html { background: #ffffff; }
    html.dark { background: #000000; }
    html.prepaint-home { background: #0f766e; }
    html.prepaint-home.dark { background: #134e4a; }
    html.prepaint-home body { background: #0f766e; }
    html.prepaint-home.dark body { background: #134e4a; }
    html.prepaint-home body > main > section:first-child { background: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #06b6d4 100%); }
    html.prepaint-home.dark body > main > section:first-child { background: linear-gradient(135deg, #134e4a 0%, #0f766e 50%, #164e63 100%); }
    .hidden { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .block { display: block; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .w-full { width: 100%; }
    .min-h-screen { min-height: 100vh; }
    #site-navbar { min-height: 70px; background: #0d9488; color: #fff; }
    html.dark #site-navbar { background: #115e59; }
    #site-navbar header { background: inherit; color: inherit; }
    #site-navbar header > div { max-width: 90rem; margin: 0 auto; min-height: 70px; padding: .75rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    #site-navbar a, #site-navbar button { color: inherit; }
    #site-navbar img { width: 40px; height: 40px; display: block; }
    html.is-authenticated #auth-not-logged-in,
    html.is-authenticated #mobile-auth-not-logged-in,
    html.is-anonymous #auth-logged-in,
    html.is-anonymous #mobile-auth-logged-in { display: none !important; }
    html.is-authenticated #auth-logged-in { display: flex !important; }
    html.is-authenticated #mobile-auth-logged-in { display: block !important; }
    html.prepaint-home main > section:first-child { min-height: 560px; color: #fff; }
    html.prepaint-home main > section:first-child > div:last-child { max-width: 90rem; margin: 0 auto; padding: 5rem 1rem; }
    html.prepaint-home main > section:first-child h1 { max-width: 52rem; margin: 0 0 1.5rem; font-size: clamp(2.5rem, 6vw, 4rem); line-height: 1.05; font-weight: 800; letter-spacing: -.03em; color: #fff; }
    html.prepaint-home main > section:first-child p { max-width: 42rem; color: #fff; }
    html.prepaint-home main > section:first-child a { min-height: 3.5rem; align-items: center; justify-content: center; text-decoration: none; }
    @media (max-width: 767px) { html.prepaint-home main > section:first-child { min-height: 720px; } }
    @font-face { font-family: "Font Awesome 6 Free"; font-style: normal; font-weight: 900; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/webfonts/fa-solid-900.woff2") format("woff2"); }
    @font-face { font-family: "Font Awesome 6 Brands"; font-style: normal; font-weight: 400; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/webfonts/fa-brands-400.woff2") format("woff2"); }
  </style>
  <script>
    (function () {
      try {
        if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
      } catch (_) {
        /* Ignore storage failures. */
      }

      const currentPath = ((location.pathname || '/').replace(/\/+$/, '') || '/').replace(/^\/en(?=\/|$)/, '') || '/';
      if (currentPath === '/') {
        document.documentElement.classList.add('prepaint-home');
        window.addEventListener('load', function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.documentElement.classList.remove('prepaint-home');
            });
          });
        }, { once: true });
      }

      const protectedPaths = new Set([
        '/calendar',
        '/dashboard',
        '/features',
        '/messages',
        '/notification-preferences',
        '/notifications',
        '/profile',
        '/progress',
        '/quizzes',
        '/surveys',
        '/teach'
      ]);

      function cleanPath(path) {
        const trimmed = (path || '/').replace(/\/+$/, '') || '/';
        return trimmed.replace(/^\/en(?=\/|$)/, '') || '/';
      }

      function storedAuthExists() {
        try {
          return !!localStorage.getItem('edu_token') && !!localStorage.getItem('edu_user');
        } catch (_) {
          return false;
        }
      }

      function redirectToLogin(returnTo) {
        document.documentElement.classList.add('auth-redirecting');
        try {
          sessionStorage.setItem('post_login_redirect', returnTo || location.pathname + location.search + location.hash);
        } catch (_) {
          /* Ignore private browsing storage failures. */
        }
        location.replace('/login');
      }

      window.redirectToLogin = redirectToLogin;

      if (storedAuthExists()) {
        document.documentElement.classList.add('is-authenticated');
      } else {
        document.documentElement.classList.add('is-anonymous');
      }

      if (protectedPaths.has(cleanPath(location.pathname)) && !storedAuthExists()) {
        redirectToLogin();
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" /></noscript>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } };
    if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
  </script>
  <style>
    html, body { overflow-x: hidden; box-sizing: border-box; }
    html.auth-redirecting body { visibility: hidden; }
    .dark { color-scheme: dark; }
    :root { color-scheme: light; }
    a, button, input, select, textarea { touch-action: manipulation; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-screen flex flex-col bg-white text-gray-900 dark:bg-black dark:text-gray-100 transition-colors duration-300 overflow-x-hidden{% endblock %}">
  <div id="site-navbar" data-inline="true">{% include "partials/navbar.html" %}</div>
  {% block content %}{% endblock %}
  <div id="site-footer" data-inline="true">{% include "partials/footer.html" %}</div>

  <script>
    function installPasswordToggles() {
      document.querySelectorAll('input[type="password"], input[data-password-toggle="true"]').forEach((input) => {
        if (input.dataset.passwordToggleInstalled === 'true') return;
        input.dataset.passwordToggleInstalled = 'true';
        const wrapper = document.createElement('div');
        wrapper.className = 'relative';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);
        input.classList.add('pr-12');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'absolute inset-y-0 right-0 px-3 text-gray-500 dark:text-gray-300 hover:text-teal-600 dark:hover:text-teal-300';
        button.setAttribute('aria-label', 'Show password');
        button.innerHTML = '<i class="fas fa-eye"></i>';
        button.addEventListener('click', () => {
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
          button.innerHTML = showing ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });
        wrapper.appendChild(button);
      });
    }
    document.addEventListener('DOMContentLoaded', installPasswordToggles);
  </script>
  <script src="/js/layout.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
