<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}Alpha One Labs - Activity Platform{% endblock %}" />
  <title>{% block title %}Alpha One Labs{% endblock %}</title>
  <style>
    html { background: #ffffff; }
    html.dark { background: #000000; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .w-full { width: 100%; }
    .min-h-screen { min-height: 100vh; }
    /* Pre-paint header (white in light, black in dark) so the page does not jump before Tailwind loads. */
    #site-navbar { min-height: 77px; background: #ffffff; color: #101010; }
    html.dark #site-navbar { background: #000000; color: #fafafa; }
    #site-navbar .a1n { position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
    #site-navbar .a1n__bar { max-width: 1280px; margin: 0 auto; min-height: 76px; display: flex; align-items: center; }
    #site-navbar .a1n__brand img { width: 34px; height: auto; }
    html.is-authenticated #auth-not-logged-in,
    html.is-authenticated #mobile-auth-not-logged-in,
    html.is-anonymous #auth-logged-in,
    html.is-anonymous #mobile-auth-logged-in { display: none !important; }
    html.is-authenticated #mobile-auth-logged-in { display: grid !important; }
    @media (min-width: 768px) { html.is-authenticated #auth-logged-in { display: flex !important; } }
    @media (min-width: 640px) {
      .sm\:inline { display: inline !important; }
    }
    @media (min-width: 768px) {
      .md\:flex { display: flex !important; }
      .md\:hidden { display: none !important; }
      .md\:block { display: block !important; }
    }
    @media (min-width: 1024px) {
      .lg\:block { display: block !important; }
      .lg\:flex { display: flex !important; }
      .lg\:hidden { display: none !important; }
    }
    @media (min-width: 1280px) {
      .xl\:flex { display: flex !important; }
      .xl\:hidden { display: none !important; }
    }
    @font-face { font-family: "Font Awesome 6 Free"; font-style: normal; font-weight: 900; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/webfonts/fa-solid-900.woff2") format("woff2"); }
    @font-face { font-family: "Font Awesome 6 Brands"; font-style: normal; font-weight: 400; font-display: swap; src: url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/webfonts/fa-brands-400.woff2") format("woff2"); }
  </style>
  <script>
    (function () {
      var root = document.documentElement;
      var dark = false;
      try {
        var cookieTheme = (document.cookie.match(/(?:^|; )a1-theme=(light|dark)/) || [])[1];
        var stored = localStorage.getItem('darkMode');
        if (cookieTheme) {
          dark = cookieTheme === 'dark';
          localStorage.setItem('darkMode', String(dark));
        } else if (stored === 'true' || stored === 'false') {
          dark = stored === 'true';
        } else {
          dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          localStorage.setItem('darkMode', String(dark));
        }
      } catch (_) {
        /* Ignore storage failures. */
      }
      if (dark) root.classList.add('dark');
      root.setAttribute('data-a1-theme', dark ? 'dark' : 'light');

      // Keep the shared Alpha One Labs theme (brand.css tokens, <a1-footer>, the
      // a1-theme cookie used across *.alphaonelabs.com) in step with learn's own
      // Tailwind `dark` class, whichever script toggles it.
      new MutationObserver(function () {
        var theme = root.classList.contains('dark') ? 'dark' : 'light';
        if (root.getAttribute('data-a1-theme') === theme) return;
        if (window.A1Theme && typeof window.A1Theme.set === 'function') window.A1Theme.set(theme);
        else root.setAttribute('data-a1-theme', theme);
      }).observe(root, { attributes: true, attributeFilter: ['class'] });
      document.addEventListener('a1-themechange', function (e) {
        var theme = e && e.detail && e.detail.theme;
        if (theme !== 'dark' && theme !== 'light') return;
        var isDark = theme === 'dark';
        if (root.classList.contains('dark') === isDark) return;
        root.classList.toggle('dark', isDark);
        try { localStorage.setItem('darkMode', String(isDark)); } catch (_) { /* ignore */ }
        if (typeof window.updateDarkModeIcon === 'function') window.updateDarkModeIcon();
      });

      const protectedPaths = new Set([
        '/calendar',
        '/dashboard',
        '/features',
        '/messages',
        '/notification-preferences',
        '/notifications',
        '/profile',
        '/progress',
        '/quizzes',
        '/surveys',
        '/teach'
      ]);

      function cleanPath(path) {
        const trimmed = (path || '/').replace(/\/+$/, '') || '/';
        return trimmed.replace(/^\/en(?=\/|$)/, '') || '/';
      }

      function storedAuthExists() {
        try {
          return !!localStorage.getItem('edu_token') && !!localStorage.getItem('edu_user');
        } catch (_) {
          return false;
        }
      }

      function redirectToLogin(returnTo) {
        document.documentElement.classList.add('auth-redirecting');
        try {
          sessionStorage.setItem('post_login_redirect', returnTo || location.pathname + location.search + location.hash);
        } catch (_) {
          /* Ignore private browsing storage failures. */
        }
        location.replace('/login');
      }

      window.redirectToLogin = redirectToLogin;

      if (storedAuthExists()) {
        document.documentElement.classList.add('is-authenticated');
      } else {
        document.documentElement.classList.add('is-anonymous');
      }

      if (protectedPaths.has(cleanPath(location.pathname)) && !storedAuthExists()) {
        redirectToLogin();
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
  <link rel="alternate icon" type="image/png" href="/images/logo.png" />
  <link rel="preconnect" href="https://design.alphaonelabs.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://design.alphaonelabs.com/brand.css" />
  <link rel="stylesheet" href="/css/a1-site.css?v=1" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" /></noscript>
  <script src="/js/a1-tailwind-theme.js?v=1"></script>
  <style>
    html, body { overflow-x: hidden; box-sizing: border-box; }
    html.auth-redirecting body { visibility: hidden; }
    .dark { color-scheme: dark; }
    :root { color-scheme: light; }
    a, button, input, select, textarea { touch-action: manipulation; }
    /* Alpha One Labs brand layer, design system v2 (tokens come from brand.css). */
    body { font-family: var(--a1-font-body, Inter, system-ui, sans-serif); }
    h1, h2, .font-display { font-family: var(--a1-font-display, "Barlow Condensed", "Arial Narrow", Impact, sans-serif); font-weight: 800; letter-spacing: -0.005em; }
    h3 { font-family: var(--a1-font-body, Inter, system-ui, sans-serif); letter-spacing: -0.02em; }
    /* Design system v2: page headings are condensed 900 uppercase (long-form prose keeps sentence case). */
    main h1, main h2 { font-weight: 900; text-transform: uppercase; line-height: .95; }
    main :is(.prose, .markdown-content, .markdown-body) :is(h1, h2) { text-transform: none; }
    :focus-visible { outline: 3px solid #d4af37; outline-offset: 2px; }
    html.dark :focus-visible { outline-color: #e1b746; }
    ::selection { background: #e1b746; color: #000; }
    /* Near-square, hard-edged controls site-wide (pill buttons and inputs included). */
    a.rounded-full, button.rounded-full, input.rounded-full, select.rounded-full, textarea.rounded-full { border-radius: 4px; }
    /* Primary buttons: brass fill with near-black text (teal/cyan classes map to gold). */
    a.bg-teal-500, a.bg-teal-600, a.bg-teal-700, button.bg-teal-500, button.bg-teal-600, button.bg-teal-700,
    a.bg-cyan-500, a.bg-cyan-600, button.bg-cyan-500, button.bg-cyan-600,
    a[class*="from-teal-"]:not(.bg-clip-text), button[class*="from-teal-"]:not(.bg-clip-text), a[class*="from-cyan-"]:not(.bg-clip-text), button[class*="from-cyan-"]:not(.bg-clip-text),
    input[type="submit"].bg-teal-600 {
      background: #d4af37; border-color: #d4af37; color: #080808;
    }
    a.bg-teal-500:hover, a.bg-teal-600:hover, a.bg-teal-700:hover, button.bg-teal-500:hover, button.bg-teal-600:hover, button.bg-teal-700:hover,
    a.bg-cyan-500:hover, a.bg-cyan-600:hover, button.bg-cyan-500:hover, button.bg-cyan-600:hover,
    a[class*="from-teal-"]:not(.bg-clip-text):hover, button[class*="from-teal-"]:not(.bg-clip-text):hover, a[class*="from-cyan-"]:not(.bg-clip-text):hover, button[class*="from-cyan-"]:not(.bg-clip-text):hover {
      background: #f0c658; border-color: #f0c658; color: #080808;
    }
    html.dark a.bg-teal-500, html.dark a.bg-teal-600, html.dark a.bg-teal-700, html.dark button.bg-teal-500, html.dark button.bg-teal-600, html.dark button.bg-teal-700,
    html.dark a[class*="from-teal-"]:not(.bg-clip-text), html.dark button[class*="from-teal-"]:not(.bg-clip-text) { background: #e1b746; border-color: #e1b746; color: #080808; }
    a.bg-teal-600 i, button.bg-teal-600 i, a[class*="from-teal-"]:not(.bg-clip-text) i, button[class*="from-teal-"]:not(.bg-clip-text) i { color: inherit; }
    button:disabled.bg-teal-600, button:disabled[class*="from-teal-"]:not(.bg-clip-text) { opacity: .55; }
    a1-footer { display: block; min-height: 280px; background: #000; }
    html:not(.dark) a1-footer { background: #fff; }
  </style>
  {% block head %}{% endblock %}
  <script>
    /* Re-apply the brand palette after any page-level tailwind.config override. */
    if (window.applyA1TailwindTheme) window.applyA1TailwindTheme();
  </script>
</head>
<body class="{% block body_class %}min-h-screen flex flex-col bg-white text-gray-900 dark:bg-black dark:text-gray-100 transition-colors duration-300 overflow-x-hidden{% endblock %}">
  <div id="site-navbar" data-inline="true">{% include "partials/navbar.html" %}</div>
  {% block content %}{% endblock %}
  <div id="site-footer" data-inline="true">{% include "partials/footer.html" %}</div>

  <script>
    function installPasswordToggles() {
      document.querySelectorAll('input[type="password"], input[data-password-toggle="true"]').forEach((input) => {
        if (input.dataset.passwordToggleInstalled === 'true') return;
        input.dataset.passwordToggleInstalled = 'true';
        const wrapper = document.createElement('div');
        wrapper.className = 'relative';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);
        input.classList.add('pr-12');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'absolute inset-y-0 right-0 px-3 text-gray-500 dark:text-gray-300 hover:text-teal-600 dark:hover:text-teal-300';
        button.setAttribute('aria-label', 'Show password');
        button.innerHTML = '<i class="fas fa-eye"></i>';
        button.addEventListener('click', () => {
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
          button.innerHTML = showing ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });
        wrapper.appendChild(button);
      });
    }
    document.addEventListener('DOMContentLoaded', installPasswordToggles);
  </script>
  <script src="/js/layout.js" defer></script>
  <script src="https://design.alphaonelabs.com/chrome.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
