name = "learn"
main = "src/worker.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*", "/admin", "/admin/*", "/admin-*", "/ref/*", "/forum", "/forum.html", "/blog", "/blog.html", "/study-groups", "/study-groups.html", "/quizzes", "/quizzes.html", "/surveys", "/surveys.html", "/challenges", "/challenges.html", "/progress", "/progress.html", "/grade-links", "/grade-links.html", "/calendar", "/calendar.html", "/memes", "/memes.html", "/success-stories", "/success-stories.html", "/feature-votes", "/feature-votes.html", "/messages", "/messages.html", "/activity", "/activity/*", "/classes-map", "/requests", "/waiting-rooms", "/cart", "/checkout-success", "/dashboard", "/donate", "/feedback", "/forgot-password", "/login", "/notification-preferences", "/notifications", "/profile", "/referral-leaderboard", "/reset-password", "/status", "/sitemap", "/teach", "/verify-email", "/virtual-classroom", "/whiteboard", "/calculator", "/contributors", "/gsoc", "/about", "/terms", "/privacy", "/cookies", "/429", "/500", "/features", "/features.html", "/legacy-features", "/legacy-features.html"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"


# Run `wrangler d1 create education_db` and paste the returned UUID below.
[[d1_databases]]
binding = "DB"
database_name = "education_db"
database_id = "a0021f2e-a8cc-4e20-8910-3c7290ba47a6"
migrations_dir = "migrations"


# Virtual Classroom Durable Object
[[durable_objects.bindings]]
name = "CLASSROOM_DO"
class_name = "ClassroomDO"

[[durable_objects.bindings]]
name = "PRESENCE_DO"
class_name = "PresenceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClassroomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceDO"]

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "alphaonelabs-production"


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[build]
command = "bash migrate.sh"

[triggers]
crons = ["0 13 * * *"]
