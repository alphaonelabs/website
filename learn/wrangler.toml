name = "learn"
main = "src/worker.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*", "/admin", "/admin/*", "/admin-*", "/ref/*", "/activity/*", "/en/*", "/es/*", "/fr/*", "/de/*", "/zh/*", "/404", "/404/", "/404.html", "/429", "/429/", "/429.html", "/500", "/500/", "/500.html", "/about", "/about/", "/about.html", "/activity",  "/activity.html", "/admin/", "/admin.html", "/blog", "/blog/", "/blog.html", "/calculator", "/calculator/", "/calculator.html", "/calendar", "/calendar/", "/calendar.html", "/cart", "/cart/", "/cart.html", "/challenges", "/challenges/", "/challenges.html", "/checkout-success", "/checkout-success/", "/checkout-success.html", "/classes-map", "/classes-map/", "/classes-map.html", "/classroom_poc", "/classroom_poc/", "/classroom_poc.html", "/contributors", "/contributors/", "/contributors.html", "/cookies", "/cookies/", "/cookies.html", "/dashboard", "/dashboard/", "/dashboard.html", "/donate", "/donate/", "/donate.html", "/feature-votes", "/feature-votes/", "/feature-votes.html", "/features", "/features/", "/features.html", "/feedback", "/feedback/", "/feedback.html", "/forgot-password", "/forgot-password/", "/forgot-password.html", "/forum", "/forum/", "/forum.html", "/grade-links", "/grade-links/", "/grade-links.html", "/gsoc", "/gsoc/", "/gsoc.html", "/", "/index.html", "/login", "/login/", "/login.html", "/memes", "/memes/", "/memes.html", "/messages", "/messages/", "/messages.html", "/notification-preferences", "/notification-preferences/", "/notification-preferences.html", "/notifications", "/notifications/", "/notifications.html", "/privacy", "/privacy/", "/privacy.html", "/profile", "/profile/", "/profile.html", "/progress", "/progress/", "/progress.html", "/quizzes", "/quizzes/", "/quizzes.html", "/referral-leaderboard", "/referral-leaderboard/", "/referral-leaderboard.html", "/requests", "/requests/", "/requests.html", "/reset-password", "/reset-password/", "/reset-password.html", "/sitemap", "/sitemap/", "/sitemap.html", "/status", "/status/", "/status.html", "/study-groups", "/study-groups/", "/study-groups.html", "/success-stories", "/success-stories/", "/success-stories.html", "/surveys", "/surveys/", "/surveys.html", "/teach", "/teach/", "/teach.html", "/terms", "/terms/", "/terms.html", "/verify-email", "/verify-email/", "/verify-email.html", "/virtual-classroom", "/virtual-classroom/", "/virtual-classroom.html", "/waiting-rooms", "/waiting-rooms/", "/waiting-rooms.html", "/whiteboard", "/whiteboard/", "/whiteboard.html", "/legacy-features", "/legacy-features/", "/legacy-features.html"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"


# Run `wrangler d1 create education_db` and paste the returned UUID below.
[[d1_databases]]
binding = "DB"
database_name = "education_db"
database_id = "a0021f2e-a8cc-4e20-8910-3c7290ba47a6"
migrations_dir = "migrations"


# Virtual Classroom Durable Object
[[durable_objects.bindings]]
name = "CLASSROOM_DO"
class_name = "ClassroomDO"

[[durable_objects.bindings]]
name = "PRESENCE_DO"
class_name = "PresenceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClassroomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceDO"]

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "alphaonelabs-production"


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1


[triggers]
crons = ["0 13 * * *"]
