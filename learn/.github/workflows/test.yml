name: Cloudflare Worker checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax check
        run: python -m py_compile src/worker.py
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run
