name = "earthmind"
main = "src/index.py"
compatibility_date = "2024-09-02"
compatibility_flags = ["python_workers"]
workers_dev = true

routes = [{ pattern = "earthmind.alphaonelabs.com", custom_domain = true }]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ENV_CACHE"
id = "5dc6998cbb134ba8bf052dc56ffa6343"

[[d1_databases]]
binding = "DB"
database_name = "earthmind"
database_id = "7e6bb2f0-bebe-4ea3-9757-d0bef60ebca5"

[vars]
ANOMALY_ZSCORE_THRESHOLD = "2.5"
ALERT_CHECK_INTERVAL_MINUTES = "15"
MAX_READINGS_PER_QUERY = "1000"

[env.staging]
name = "earthmind-staging"
vars = { ANOMALY_ZSCORE_THRESHOLD = "3.0" }

[env.production]
name = "earthmind-production"
workers_dev = false
