{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In – LearnPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 min-h-screen flex items-center justify-center">
<div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
  <div class="text-center mb-6">
    <a href="/" class="text-3xl font-extrabold text-indigo-700">🚀 LearnPilot</a>
    <p class="text-gray-500 text-sm mt-2">Sign in to continue learning</p>
  </div>

  {% if form.errors %}
  <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl mb-4">
    Invalid username or password.
  </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="id_username">Username</label>
      <input id="id_username" name="username" type="text" autofocus
        class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="id_password">Password</label>
      <input id="id_password" name="password" type="password"
        class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <button type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
      Sign In
    </button>
  </form>

  <p class="mt-4 text-sm text-center text-gray-500">
    No account? <a href="{% url 'register' %}" class="text-indigo-600 hover:underline">Register here</a>
  </p>
</div>
</body>
</html>
