{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register – LearnPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 min-h-screen flex items-center justify-center">
<div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
  <div class="text-center mb-6">
    <a href="/" class="text-3xl font-extrabold text-indigo-700">🚀 LearnPilot</a>
    <p class="text-gray-500 text-sm mt-2">Create your free account</p>
  </div>

  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">
        {{ field.label }}
      </label>
      <input id="{{ field.id_for_label }}" name="{{ field.html_name }}"
        type="{% if 'password' in field.html_name %}password{% else %}text{% endif %}"
        class="w-full border {% if field.errors %}border-red-400{% else %}border-gray-200{% endif %} rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      {% if field.errors %}
      <p class="mt-1 text-xs text-red-600">{{ field.errors|join:", " }}</p>
      {% endif %}
      {% if field.help_text %}
      <p class="mt-1 text-xs text-gray-400">{{ field.help_text }}</p>
      {% endif %}
    </div>
    {% endfor %}

    <button type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition mt-2">
      Create Account
    </button>
  </form>

  <p class="mt-4 text-sm text-center text-gray-500">
    Already have an account? <a href="{% url 'login' %}" class="text-indigo-600 hover:underline">Sign in</a>
  </p>
</div>
</body>
</html>
