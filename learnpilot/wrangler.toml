name = "learnpilot-ai"
main = "src/worker.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"

# Optional: bind a KV namespace for caching AI responses.
# Create a namespace with: wrangler kv:namespace create CACHE
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<your-kv-namespace-id>"

# Optional: rate-limit binding
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 100, period = 60 }
