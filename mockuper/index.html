<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mockuper — Wireframe Studio · Alpha One Labs</title>
    <meta name="description" content="Mockuper: a free, open-source wireframe studio from Alpha One Labs.">
    <link rel="stylesheet" href="https://design.alphaonelabs.com/brand.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://design.alphaonelabs.com/chrome.js" defer></script>
</head>
<body>
    <a1-header site="Mockuper" site-href="/"></a1-header>
    <div class="app">
        <header class="header">
            <div class="logo">
                <h1 class="logo-title">Wireframe Studio</h1>
                <div class="logo-meta">
                    <span class="version" id="version">Loading...</span>
                    <a class="a1-credit" href="https://alphaonelabs.com">by Alpha One Labs</a>
                </div>
            </div>
            <div class="toolbar" role="toolbar" aria-label="Editor tools">
                <div class="toolbar-group">
                    <button class="btn" id="undo-btn" disabled>↶ Undo</button>
                    <button class="btn" id="redo-btn" disabled>↷ Redo</button>
                </div>
                <div class="toolbar-group">
                    <button class="btn" id="grid-toggle-btn">◫ Hide Grid</button>
                </div>
                <div class="toolbar-group">
                    <button class="btn" id="bring-front-btn" disabled>⬆ Front</button>
                    <button class="btn" id="send-back-btn" disabled>⬇ Back</button>
                </div>
                <div class="toolbar-group">
                    <button class="btn" id="delete-btn" disabled>🗑 Delete</button>
                </div>
                <div class="toolbar-group">
                    <button class="btn" id="export-png-btn">📷 PNG</button>
                    <button class="btn" id="export-pdf-btn">📄 PDF</button>
                    <button class="btn" id="export-json-btn">💾 Export JSON</button>
                    <button class="btn" id="import-json-btn">📁 Import JSON</button>
                </div>
                <div class="toolbar-group">
                    <a href="https://github.com/alphaonelabs/alphaonelabs-mockups" target="_blank" rel="noopener noreferrer" class="btn collaborate-btn"><span aria-hidden="true">🤝</span> Collaborate</a>
                    <a href="https://github.com/alphaonelabs/website/tree/main/mockuper" target="_blank" rel="noopener noreferrer" class="btn btn-primary contribute-btn"><span aria-hidden="true">🛠</span> Contribute</a>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar" id="left-sidebar">
                <button class="collapse-btn" id="left-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button>
                <h2>Pages</h2>
                <div class="pages-list" id="pages-list"></div>
                <button class="btn" id="add-page-btn" style="width: 100%; margin-top: 8px;">+ Add Page</button>

                <h2 style="margin-top: 24px;">Components</h2>
                <div class="components-list" id="components-grid">
                    <button class="component-btn" data-type="button" draggable="true">
                        <div class="component-preview button-preview"></div>
                        <span>Button</span>
                    </button>
                    <button class="component-btn" data-type="input" draggable="true">
                        <div class="component-preview input-preview"></div>
                        <span>Input</span>
                    </button>
                    <button class="component-btn" data-type="text" draggable="true">
                        <div class="component-preview text-preview"></div>
                        <span>Text</span>
                    </button>
                    <button class="component-btn" data-type="image" draggable="true">
                        <div class="component-preview image-preview"></div>
                        <span>Image</span>
                    </button>
                    <button class="component-btn" data-type="navbar" draggable="true">
                        <div class="component-preview navbar-preview"></div>
                        <span>Nav Bar</span>
                    </button>
                    <button class="component-btn" data-type="table" draggable="true">
                        <div class="component-preview table-preview"></div>
                        <span>Table</span>
                    </button>
                    <button class="component-btn" data-type="modal" draggable="true">
                        <div class="component-preview modal-preview"></div>
                        <span>Modal</span>
                    </button>
                    <button class="component-btn" data-type="frame" draggable="true">
                        <div class="component-preview frame-preview"></div>
                        <span>Frame</span>
                    </button>
                    <button class="component-btn" data-type="browser" draggable="true">
                        <div class="component-preview browser-preview"></div>
                        <span>Browser Window</span>
                    </button>
                    <button class="component-btn" data-type="mobile" draggable="true">
                        <div class="component-preview mobile-preview"></div>
                        <span>Mobile App</span>
                    </button>
                </div>
            </aside>

            <main class="canvas-container" aria-label="Wireframe canvas">
                <div class="canvas" id="canvas">
                    <div class="canvas-content" id="canvas-content">
                        <div class="grid" id="grid"></div>
                    </div>
                </div>

                <div class="zoom-control">
                    <button class="zoom-btn" id="zoom-out-btn" aria-label="Zoom out">−</button>
                    <div class="zoom-level" id="zoom-level" aria-live="polite">100%</div>
                    <button class="zoom-btn" id="zoom-in-btn" aria-label="Zoom in">+</button>
                    <button class="zoom-btn" id="zoom-reset-btn">Reset</button>
                </div>
            </main>

            <aside class="property-panel" id="property-panel" style="display: none;">
                <button class="collapse-btn" id="right-collapse-btn" title="Collapse panel" aria-label="Collapse panel">›</button>
                <h2>Properties</h2>
                <div class="property-group">
                    <label for="prop-text">Text</label>
                    <textarea id="prop-text"></textarea>
                </div>
                <div class="property-group">
                    <label for="prop-x">X Position</label>
                    <input type="number" id="prop-x">
                </div>
                <div class="property-group">
                    <label for="prop-y">Y Position</label>
                    <input type="number" id="prop-y">
                </div>
                <div class="property-group">
                    <label for="prop-width">Width</label>
                    <input type="number" id="prop-width">
                </div>
                <div class="property-group">
                    <label for="prop-height">Height</label>
                    <input type="number" id="prop-height">
                </div>
            </aside>
        </div>
    </div>

    <input type="file" id="json-file-input" accept=".json" style="display: none;" aria-label="Import JSON file">

    <script type="module" src="js/app.js"></script>
</body>
</html>
